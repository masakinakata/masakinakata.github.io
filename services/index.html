<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サービス解説</title>
<link rel="stylesheet" href="service.css">
</head>
<body>
<main>
  <nav class="crumbs"><a href="../index.html">クイズ</a> / サービス解説</nav>
  <header>
    <span class="tag">SAP-C02</span>
    <h1>サービス解説</h1>
    <p class="lead">練習問題で肝となるサービスを、構成図つきで解説しています。</p>
  </header>
  <div id="list"></div>
  <noscript><p>一覧の表示には JavaScript が必要です。</p></noscript>
  <p class="back"><a href="../index.html">← クイズに戻る</a></p>
</main>
<script src="catalog.js"></script>
<script>
  const byCat = {};
  for (const [id, s] of Object.entries(SERVICES)) (byCat[s.category] ||= []).push({ id, ...s });
  document.getElementById("list").innerHTML = Object.entries(byCat).map(([cat, items]) => `
    <h2 class="cat">${cat}</h2>
    <div class="svc-grid">
      ${items.map(s => `<a class="svc-card" href="${s.id}.html"><strong>${s.name}</strong><span>${s.summary}</span></a>`).join("")}
    </div>`).join("");
</script>
</body>
</html>
