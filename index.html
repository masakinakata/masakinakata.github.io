<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP 練習問題</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d232b;
    --muted: #5b6573;
    --border: #d9dee5;
    --accent: #e8710a;
    --accent-weak: #fff3e8;
    --ok: #1e8e3e;
    --ok-weak: #e7f5ec;
    --ng: #c5221f;
    --ng-weak: #fdeceb;
    --code-bg: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c;
      --card: #1b2129;
      --text: #e6e9ee;
      --muted: #9aa4b2;
      --border: #2e3744;
      --accent: #ff9a3c;
      --accent-weak: #3a2a1a;
      --ok: #5cc27a;
      --ok-weak: #18301f;
      --ng: #f07470;
      --ng-weak: #3a1c1c;
      --code-bg: #242c37;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --card: #1b2129; --text: #e6e9ee; --muted: #9aa4b2; --border: #2e3744;
    --accent: #ff9a3c; --accent-weak: #3a2a1a; --ok: #5cc27a; --ok-weak: #18301f;
    --ng: #f07470; --ng-weak: #3a1c1c; --code-bg: #242c37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    line-height: 1.75;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  header { margin-bottom: 20px; }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
    color: var(--accent); background: var(--accent-weak);
    padding: 2px 10px; border-radius: 999px; margin: 0 6px 4px 0;
  }
  .tag.review { color: var(--ng); background: var(--ng-weak); }
  h1 { font-size: 22px; margin: 10px 0 0; }
  .progress { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .progress .bar { flex: 1; height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .progress .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; margin-bottom: 20px;
  }
  .scenario p { margin: 0 0 12px; }
  .reqs { margin: 8px 0 16px; padding-left: 1.3em; }
  .reqs li { margin-bottom: 4px; }
  .question { font-weight: 700; margin-top: 8px; }
  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .option label {
    display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
    border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px;
    transition: border-color .15s, background .15s;
  }
  .option label:hover { border-color: var(--accent); }
  .option input { margin-top: 6px; accent-color: var(--accent); flex-shrink: 0; }
  .option .key { font-weight: 700; min-width: 1.2em; }
  .option input:checked + .key { color: var(--accent); }
  .option.selected label { border-color: var(--accent); background: var(--accent-weak); }
  .option.correct label { border-color: var(--ok); background: var(--ok-weak); }
  .option.wrong label { border-color: var(--ng); background: var(--ng-weak); }
  .answered .option label { cursor: default; }
  .answered .option label:hover { border-color: inherit; }
  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
  .hint { font-size: 13px; color: var(--muted); }
  button {
    font: inherit; font-weight: 700; border-radius: 8px; padding: 10px 22px; cursor: pointer;
    border: 1.5px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .result {
    display: none; font-weight: 700; font-size: 18px; padding: 14px 18px;
    border-radius: 10px; margin-bottom: 20px;
  }
  .result.ok { display: block; background: var(--ok-weak); color: var(--ok); border: 1px solid var(--ok); }
  .result.ng { display: block; background: var(--ng-weak); color: var(--ng); border: 1px solid var(--ng); }
  #explanation { display: none; }
  #explanation.show { display: block; }
  h2 { font-size: 18px; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid var(--accent); }
  h3 { font-size: 15px; margin: 20px 0 6px; }
  .why { margin: 0 0 14px; padding: 12px 14px; border-radius: 8px; background: var(--code-bg); }
  .why .verdict { font-weight: 700; margin-right: 6px; }
  .why .verdict.ok { color: var(--ok); }
  .why .verdict.ng { color: var(--ng); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 520px; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  tr.hit td { background: var(--accent-weak); font-weight: 700; }
  code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: .92em; }
  pre {
    background: var(--code-bg); border-radius: 8px; padding: 12px 14px; overflow-x: auto;
    font-size: 13px; line-height: 1.5; margin: 0 0 14px;
  }
  pre code { background: none; padding: 0; }
  ul.points { padding-left: 1.3em; margin: 0; }
  ul.points li { margin-bottom: 6px; }

  /* 結果画面 */
  .score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .score .num { font-size: 44px; font-weight: 800; line-height: 1.1; }
  .score .den { font-size: 20px; color: var(--muted); font-weight: 700; }
  .score .pct { font-size: 16px; color: var(--muted); }
  .summary-msg { margin: 0 0 4px; }
  .review-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .review-list li {
    display: flex; gap: 12px; align-items: flex-start;
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
  }
  .review-list .mark { font-weight: 800; flex-shrink: 0; min-width: 1.2em; }
  .review-list li.ok .mark { color: var(--ok); }
  .review-list li.ng { background: var(--ng-weak); border-color: var(--ng); }
  .review-list li.ng .mark { color: var(--ng); }
  .review-list .meta { font-size: 12px; color: var(--muted); display: block; }
  .review-list .ans { font-size: 13px; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- ===== 出題画面 ===== -->
  <div id="quizView">
    <header>
      <span class="tag">SAP-C02</span><span class="tag" id="domainTag"></span><span class="tag review" id="modeTag" hidden></span>
      <h1 id="qTitle"></h1>
      <div class="progress">
        <span id="progressText"></span>
        <div class="bar"><span id="progressBar"></span></div>
      </div>
    </header>

    <section class="card scenario" id="scenario"></section>

    <section class="card" id="quiz">
      <ul class="options" id="options"></ul>
      <div class="actions">
        <button id="submit" disabled>回答する</button>
        <span class="hint" id="hint"></span>
        <button id="nextTop" class="secondary" hidden>次の問題へ</button>
      </div>
    </section>

    <div class="result" id="result" role="status"></div>

    <section class="card" id="explanation"></section>
  </div>

  <!-- ===== 結果画面 ===== -->
  <div id="summaryView" hidden>
    <header>
      <span class="tag">SAP-C02</span><span class="tag review" id="summaryModeTag" hidden></span>
      <h1>結果</h1>
    </header>
    <section class="card">
      <div class="score">
        <span class="num" id="scoreNum"></span><span class="den" id="scoreDen"></span><span class="pct" id="scorePct"></span>
      </div>
      <p class="summary-msg" id="summaryMsg"></p>
      <div class="actions">
        <button id="retryWrong">間違えた問題を解き直す</button>
        <button id="restartAll" class="secondary">全問をシャッフルして最初から</button>
      </div>
    </section>
    <section class="card">
      <h2>今回の回答一覧</h2>
      <ul class="review-list" id="reviewList"></ul>
    </section>
  </div>
</main>

<script>
/* =========================================================
   問題データ
   - answer は配列。2 つ以上なら「複数選択」として出題される
   - why は選択肢ごとの解説（HTML 可）
   - extra は任意の追加 HTML（表やコード例）
   ========================================================= */
const D1 = "Domain 1: 組織の複雑さに対応するソリューションの設計";
const D2 = "Domain 2: 新しいソリューションの設計";
const D3 = "Domain 3: 既存ソリューションの継続的な改善";
const D4 = "Domain 4: ワークロードの移行とモダナイゼーションの加速";

const QUESTIONS = [
  /* ---------- 1 ---------- */
  {
    id: 1,
    domain: D2,
    title: "マルチリージョンの災害対策",
    scenario: `
      <p>ある EC 企業は、us-east-1 リージョンで基幹の注文システムを運用している。構成は
      <strong>Application Load Balancer</strong> + <strong>EC2 Auto Scaling グループ</strong>（ステートレスな Web/AP 層）+
      <strong>Amazon Aurora MySQL</strong>（Multi-AZ）である。</p>
      <p>リージョン全体の障害に備え、別リージョン（us-west-2）への災害対策を構築することになった。経営層からの要件は以下のとおり。</p>
      <ul class="reqs">
        <li>RPO（目標復旧時点）：<strong>1 分以内</strong></li>
        <li>RTO（目標復旧時間）：<strong>15 分以内</strong></li>
        <li>アプリケーションコードの大規模な改修は行わない</li>
        <li>上記を満たしたうえで、<strong>平常時のコストを最小化</strong>する</li>
      </ul>`,
    question: "ソリューションアーキテクトはどの構成を推奨すべきか。",
    options: {
      A: "AWS Backup で Aurora のスナップショットと EC2 の AMI を 1 時間ごとに us-west-2 へコピーする。障害時は CloudFormation テンプレートで us-west-2 に環境一式を作成し、スナップショットから Aurora を復元したうえで Route 53 の DNS レコードを切り替える。",
      B: "Aurora Global Database を構成し、us-west-2 にセカンダリクラスターを作成する。us-west-2 には AMI と起動テンプレートを用意し、ALB と最小キャパシティを小さく設定した Auto Scaling グループを配置しておく。Route 53 のフェイルオーバールーティングとヘルスチェックを設定し、障害時はセカンダリクラスターを昇格させて Auto Scaling グループをスケールアウトする。",
      C: "データベースを Amazon DynamoDB グローバルテーブルに移行し、us-east-1 と us-west-2 の両方で本番と同じキャパシティの ALB と Auto Scaling グループを常時稼働させる。Route 53 のレイテンシーベースルーティングで両リージョンにトラフィックを分散する。",
      D: "us-east-1 の Aurora クラスターに、3 つのアベイラビリティーゾーンへ分散した Aurora レプリカを追加する。Auto Scaling グループも 3 AZ にまたがるよう設定し、ALB のクロスゾーン負荷分散を有効にする。"
    },
    answer: ["B"],
    summary: `正解は <strong>B</strong>。<strong>ウォームスタンバイ（パイロットライトに近い縮小構成）</strong>で、RPO 1 分・RTO 15 分を満たしつつ平常時コストを抑えられるのはこの構成だけです。`,
    why: {
      A: `バックアップ＆リストア方式。スナップショットのコピーが 1 時間ごとなので <strong>RPO は最大 1 時間</strong>となり要件（1 分）を満たさない。さらに障害時に環境構築とスナップショット復元を行うため、データ量によっては <strong>RTO 15 分も厳しい</strong>。コストは最安だが要件未達。`,
      B: `Aurora Global Database はストレージ層で非同期レプリケーションを行い、<strong>リージョン間の遅延は通常 1 秒未満</strong>。障害時はセカンダリを昇格（<code>failover-global-cluster</code> など）でき、数分以内に書き込み可能になるため RPO・RTO ともに満たす。DR 側の EC2 は最小台数にしておき、切り替え時にスケールアウトすることで<strong>平常時コストを抑えられる</strong>。アプリ側は接続先エンドポイントが変わるだけで大規模改修も不要。`,
      C: `マルチサイト（アクティブ/アクティブ）方式。RPO/RTO はほぼゼロにできるが、<strong>両リージョンでフルキャパシティを常時稼働</strong>させるためコスト最小化に反する。また RDB から DynamoDB への移行は<strong>アプリの大規模改修</strong>が必要で、制約にも違反する。`,
      D: `AZ 障害への耐性（高可用性）は上がるが、すべて us-east-1 内に閉じているため<strong>リージョン障害には対応できない</strong>。「HA」と「DR」を混同させるひっかけ。`
    },
    extra: `
      <h3>DR 戦略の比較（頻出）</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>戦略</th><th>RPO / RTO の目安</th><th>平常時コスト</th><th>本問の選択肢</th></tr></thead>
          <tbody>
            <tr><td>バックアップ＆リストア</td><td>時間単位</td><td>最小</td><td>A</td></tr>
            <tr><td>パイロットライト</td><td>分〜数十分</td><td>小（DB のみ常時稼働）</td><td>—</td></tr>
            <tr class="hit"><td>ウォームスタンバイ</td><td>秒〜分</td><td>中（縮小版を常時稼働）</td><td>B</td></tr>
            <tr><td>マルチサイト（アクティブ/アクティブ）</td><td>ほぼゼロ</td><td>最大</td><td>C</td></tr>
          </tbody>
        </table>
      </div>`,
    points: [
      `「RPO が秒〜1 分」「リレーショナル DB」「別リージョン」の組み合わせが出たら <strong>Aurora Global Database</strong> をまず疑う。`,
      `SAP では「要件を満たす選択肢」が複数あり、<strong>「コスト最小」「運用負荷最小」などの最後の条件</strong>で絞り込ませる問題が多い。`,
      `Multi-AZ やリードレプリカの追加は<strong>高可用性（HA）</strong>であって、<strong>リージョン障害の DR ではない</strong>。`,
      `DNS の切り替えは Route 53 のフェイルオーバールーティング + ヘルスチェックが定番。より高速・確実な切り替えが必要なら Route 53 Application Recovery Controller も選択肢になる。`
    ]
  },

  /* ---------- 2 ---------- */
  {
    id: 2,
    domain: D1,
    title: "多数の VPC とオンプレミスの接続",
    scenario: `
      <p>ある製造業の企業は AWS Organizations で 40 個の AWS アカウントを管理しており、各アカウントに 1〜2 個の VPC（合計約 60 個）がある。
      オンプレミスのデータセンターとは <strong>10 Gbps の AWS Direct Connect</strong> 専用接続で結ばれている。</p>
      <p>新たに以下の要件が出された。</p>
      <ul class="reqs">
        <li>すべての VPC 間、および各 VPC とオンプレミス間で<strong>相互に通信</strong>できること</li>
        <li>今後 2 年で VPC は <strong>200 個程度まで増える</strong>見込み</li>
        <li>ネットワークチームが 1 つのアカウントから<strong>ルーティングを集中管理</strong>したい</li>
        <li><strong>運用負荷を最小化</strong>する</li>
      </ul>`,
    question: "これらの要件を満たす最適な設計はどれか。",
    options: {
      A: "すべての VPC 間をフルメッシュの VPC ピアリングで接続する。各 VPC に仮想プライベートゲートウェイ（VGW）をアタッチし、VPC ごとに Direct Connect のプライベート VIF を作成してオンプレミスと接続する。",
      B: "ネットワーク専用アカウントに AWS Transit Gateway を作成し、AWS RAM で組織内に共有して各 VPC をアタッチする。Direct Connect ゲートウェイを作成してトランジット VIF で接続し、Transit Gateway に関連付ける。",
      C: "ハブ VPC にサードパーティ製の VPN アプライアンスを EC2 で冗長構成し、各 VPC の VGW からハブ VPC へ Site-to-Site VPN を張る「トランジット VPC」構成にする。オンプレミスもハブ VPC に VPN で接続する。",
      D: "各 VPC のサービスを Network Load Balancer の背後に配置し、AWS PrivateLink のエンドポイントサービスとして公開する。他の VPC やオンプレミスからはインターフェイス VPC エンドポイント経由でアクセスする。"
    },
    answer: ["B"],
    summary: `正解は <strong>B</strong>。多数の VPC とオンプレミスを<strong>ハブ＆スポーク</strong>で推移的に接続でき、1 アカウントから集中管理できるのは Transit Gateway + Direct Connect ゲートウェイの組み合わせです。`,
    why: {
      A: `VPC ピアリングは<strong>推移的ルーティング不可</strong>のため、全 VPC 間を結ぶにはフルメッシュ（200 VPC なら約 2 万本）が必要。1 VPC あたりのピアリング数にも上限があり、VPC ごとの VIF 作成も含め<strong>運用負荷・スケーラビリティともに破綻</strong>する。`,
      B: `Transit Gateway はリージョン内のハブとして<strong>数千の VPC アタッチメント</strong>を扱え、ルートテーブルでセグメント分割も可能。AWS RAM で共有すれば各アカウントの VPC からアタッチでき、ルーティングはネットワークアカウントで<strong>集中管理</strong>できる。Direct Connect ゲートウェイ + <strong>トランジット VIF</strong> でオンプレミスとも 1 か所で接続できる。`,
      C: `かつての定番構成だが、EC2 アプライアンスの冗長化・パッチ・ライセンス管理が必要で<strong>運用負荷が高い</strong>。VPN トンネルあたりの帯域（約 1.25 Gbps）の制約もあり、Transit Gateway 登場後は推奨されない。`,
      D: `PrivateLink は<strong>特定サービスを一方向に公開</strong>する仕組みで、ネットワーク全体の相互ルーティングを提供するものではない。「すべての VPC 間で相互通信」という要件を満たせない。`
    },
    points: [
      `「多数の VPC」「推移的接続」「集中管理」→ <strong>Transit Gateway + AWS RAM 共有</strong>が定番。`,
      `Direct Connect と Transit Gateway をつなぐのは<strong>トランジット VIF</strong>（プライベート VIF ではない）。Direct Connect ゲートウェイ経由で関連付ける。`,
      `複数リージョンにまたがる場合は Transit Gateway ピアリング、さらに大規模・ポリシー駆動のグローバル WAN なら AWS Cloud WAN も候補。`,
      `PrivateLink は「サービス単位」「一方向」「CIDR 重複でも可」がキーワード。`
    ]
  },

  /* ---------- 3 ---------- */
  {
    id: 3,
    domain: D1,
    title: "リージョン利用の制限とガバナンス",
    scenario: `
      <p>ある金融機関は AWS Organizations で多数のメンバーアカウントを運用している。データ所在地の規制に対応するため、セキュリティ部門から以下の要件が示された。</p>
      <ul class="reqs">
        <li>すべてのメンバーアカウントで、<strong>ap-northeast-1 と ap-northeast-3 以外のリージョン</strong>ではリソースを作成・操作できないようにする</li>
        <li>IAM、Route 53、CloudFront などの<strong>グローバルサービス</strong>は引き続き利用できること</li>
        <li>メンバーアカウントの管理者（AdministratorAccess を持つユーザーや root ユーザーを含む）でも<strong>この制限を解除・回避できない</strong>こと</li>
        <li>メンバーアカウントが<strong>組織から脱退できない</strong>ようにする</li>
      </ul>`,
    question: "これらの要件を満たす最も効果的な方法はどれか。",
    options: {

/* =========================================================
   ロジック
   ========================================================= */
const $ = (id) => document.getElementById(id);
const els = {
  quizView: $("quizView"), summaryView: $("summaryView"),
  domainTag: $("domainTag"), modeTag: $("modeTag"), qTitle: $("qTitle"),
  progressText: $("progressText"), progressBar: $("progressBar"),
  scenario: $("scenario"), quiz: $("quiz"), options: $("options"),
  submit: $("submit"), hint: $("hint"), nextTop: $("nextTop"),
  result: $("result"), explanation: $("explanation"),
  summaryModeTag: $("summaryModeTag"),
  scoreNum: $("scoreNum"), scoreDen: $("scoreDen"), scorePct: $("scorePct"),
  summaryMsg: $("summaryMsg"), reviewList: $("reviewList"),
  retryWrong: $("retryWrong"), restartAll: $("restartAll")
};

const state = {
  queue: [],     // 今回のラウンドで出題する問題（シャッフル済み）
  index: 0,
  records: [],   // { q, chosen: [], ok: bool }
  round: 1,      // 1 = 全問、2 以降 = 解き直し
  answered: false
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startRound(questions, round) {
  state.queue = shuffle(questions);
  state.index = 0;
  state.records = [];
  state.round = round;
  els.summaryView.hidden = true;
  els.quizView.hidden = false;
  renderQuestion();
}

function currentQ() { return state.queue[state.index]; }

function renderQuestion() {
  const q = currentQ();
  const total = state.queue.length;
  const n = state.index + 1;
  const multi = q.answer.length > 1;
  state.answered = false;

  els.domainTag.textContent = q.domain;
  els.modeTag.hidden = state.round === 1;
  els.modeTag.textContent = `解き直し ${state.round - 1} 回目`;
  els.qTitle.textContent = `第 ${n} 問 — ${q.title}`;
  els.progressText.textContent = `${n} / ${total}`;
  els.progressBar.style.width = `${(state.index / total) * 100}%`;

  const chooseText = multi ? `（${q.answer.length} つ選択）` : "（1 つ選択）";
  const qText = q.question.includes("選択）") ? q.question : q.question + chooseText;
  els.scenario.innerHTML = q.scenario + `<p class="question">${qText}</p>`;

  const type = multi ? "checkbox" : "radio";
  els.options.innerHTML = Object.entries(q.options).map(([key, text]) => `
    <li class="option" data-key="${key}">
      <label><input type="${type}" name="answer" value="${key}"><span class="key">${key}.</span>
        <span>${text}</span>
      </label>
    </li>`).join("");

  els.quiz.classList.remove("answered");
  els.submit.hidden = false;
  els.submit.disabled = true;
  els.hint.textContent = multi ? `${q.answer.length} つ選んでください` : "";
  els.nextTop.hidden = true;
  els.result.className = "result";
  els.result.textContent = "";
  els.explanation.classList.remove("show");
  els.explanation.innerHTML = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function checkedKeys() {
  return [...els.options.querySelectorAll('input[name="answer"]:checked')].map(i => i.value);
}

els.options.addEventListener("change", () => {
  if (state.answered) return;
  const q = currentQ();
  const keys = checkedKeys();
  els.options.querySelectorAll(".option").forEach(li =>
    li.classList.toggle("selected", keys.includes(li.dataset.key)));
  if (q.answer.length > 1) {
    const need = q.answer.length;
    els.submit.disabled = keys.length !== need;
    els.hint.textContent = keys.length === need ? "" :
      keys.length > need ? `選択が多すぎます（${need} つ選んでください）` : `あと ${need - keys.length} つ選んでください`;
  } else {
    els.submit.disabled = keys.length === 0;
  }
});

els.submit.addEventListener("click", () => {
  const q = currentQ();
  const chosen = checkedKeys().sort();
  if (chosen.length !== q.answer.length) return;
  state.answered = true;

  const correct = q.answer.slice().sort();
  const ok = chosen.join() === correct.join();
  state.records.push({ q, chosen, ok });

  els.quiz.classList.add("answered");
  els.options.querySelectorAll('input[name="answer"]').forEach(i => i.disabled = true);
  els.options.querySelectorAll(".option").forEach(li => {
    const k = li.dataset.key;
    li.classList.remove("selected");
    if (correct.includes(k)) li.classList.add("correct");
    else if (chosen.includes(k)) li.classList.add("wrong");
  });

  const correctText = correct.join(", ");
  els.result.className = "result " + (ok ? "ok" : "ng");
  els.result.textContent = ok
    ? `✓ 正解！ 正解は ${correctText} です。`
    : `✗ 不正解… あなたの回答は ${chosen.join(", ")}、正解は ${correctText} です。`;

  renderExplanation(q);
  els.submit.hidden = true;
  els.hint.textContent = "";
  els.nextTop.hidden = false;
  els.nextTop.textContent = nextLabel();
  els.result.scrollIntoView({ behavior: "smooth", block: "start" });
});

function nextLabel() {
  return state.index + 1 < state.queue.length ? "次の問題へ →" : "結果を見る →";
}

function renderExplanation(q) {
  const whys = Object.keys(q.options).map(k => {
    const ok = q.answer.includes(k);
    return `<div class="why"><span class="verdict ${ok ? "ok" : "ng"}">${k} ${ok ? "✓" : "✗"}</span>${q.why[k] || ""}</div>`;
  }).join("");
  els.explanation.innerHTML = `
    <h2>解説</h2>
    <p>${q.summary}</p>
    <h3>各選択肢の検討</h3>
    ${whys}
    ${q.extra || ""}
    <h3>押さえておきたいポイント</h3>
    <ul class="points">${q.points.map(p => `<li>${p}</li>`).join("")}</ul>
    <div class="actions"><button class="next-btn">${nextLabel()}</button></div>`;
  els.explanation.classList.add("show");
  els.explanation.querySelector(".next-btn").addEventListener("click", goNext);
}

function goNext() {
  if (state.index + 1 < state.queue.length) {
    state.index++;
    renderQuestion();
  } else {
    showSummary();
  }
}
els.nextTop.addEventListener("click", goNext);

function showSummary() {
  const total = state.records.length;
  const okCount = state.records.filter(r => r.ok).length;
  const wrong = state.records.filter(r => !r.ok);

  els.quizView.hidden = true;
  els.summaryView.hidden = false;
  els.summaryModeTag.hidden = state.round === 1;
  els.summaryModeTag.textContent = `解き直し ${state.round - 1} 回目`;

  els.scoreNum.textContent = okCount;
  els.scoreDen.textContent = `/ ${total} 問正解`;
  els.scorePct.textContent = `（${Math.round((okCount / total) * 100)}%）`;

  if (wrong.length === 0) {
    els.summaryMsg.textContent = state.round === 1
      ? "全問正解です！ 素晴らしい。"
      : "間違えた問題をすべてクリアしました！";
    els.retryWrong.hidden = true;
  } else {
    els.summaryMsg.textContent = `${wrong.length} 問間違えました。解説を確認して解き直してみましょう。`;
    els.retryWrong.hidden = false;
    els.retryWrong.textContent = `間違えた ${wrong.length} 問を解き直す`;
  }
  els.restartAll.textContent = `全 ${QUESTIONS.length} 問をシャッフルして最初から`;

  // 間違えた問題を上に並べる
  const sorted = [...wrong, ...state.records.filter(r => r.ok)];
  els.reviewList.innerHTML = sorted.map(r => `
    <li class="${r.ok ? "ok" : "ng"}">
      <span class="mark">${r.ok ? "✓" : "✗"}</span>
      <span>
        <span class="meta">${r.q.domain}</span>
        <strong>${r.q.title}</strong><br>
        <span class="ans">あなたの回答: ${r.chosen.join(", ")} ／ 正解: ${r.q.answer.slice().sort().join(", ")}</span>
      </span>
    </li>`).join("");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

els.retryWrong.addEventListener("click", () => {
  const wrongQs = state.records.filter(r => !r.ok).map(r => r.q);
  if (wrongQs.length) startRound(wrongQs, state.round + 1);
});
els.restartAll.addEventListener("click", () => startRound(QUESTIONS, 1));

// 起動時：全問をランダムな順番で出題
startRound(QUESTIONS, 1);
</script>
